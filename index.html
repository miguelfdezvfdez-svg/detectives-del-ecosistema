<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detectives del ecosistema</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8efdf;color:#173e37;font:1.15rem/1.5 system-ui}main{max-width:690px;margin:4vh auto;padding:clamp(18px,5vw,48px);background:#fffcf1;border-radius:24px;border:2px solid #31584c}small{font-weight:750;color:#50604d}h1{font: bold clamp(2rem,7vw,3.8rem)/1 Georgia;margin:.45em 0}h2{font-size:1.5rem}.land{position:relative;background:linear-gradient(#a9dfe2 44%,#a8bf78 45%,#75965f 70%,#78c1cd 71%);border-radius:18px;height:155px;overflow:hidden}.land span{position:absolute;font-size:2rem}button{font:inherit;font-weight:700;color:#fff;background:#215d50;border:0;border-radius:12px;padding:12px 18px;margin:5px;cursor:pointer}button:hover{background:#184539}button:focus-visible{outline:4px solid #df8f16}button:disabled{opacity:.65}#note{min-height:1.5em}
</style><main><small>CUADERNO DE CAMPO · TENERIFE</small><h1>Detectives del ecosistema</h1><div class="land" aria-hidden="true"><span style="left:7%;top:8%">☀️</span><span style="left:22%;top:39%">🌿</span><span style="left:48%;top:45%">🦎</span><span style="left:76%;top:49%">🪨</span><span style="left:61%;top:71%">🐸</span></div><p id="step"></p><h2 id="question" tabindex="-1"></h2><p id="hint"></p><div id="buttons"></div><p id="note" role="status"></p><div id="next"></div></main><script>
const get=id=>document.getElementById(id);
const challenges=[
['Encuentra','¿Qué ser vivo de la orilla tiene escamas?',['🦎 Lagarto','🐸 Rana','🪨 Roca'],0,'Observa la piel de los dos animales.','El lagarto es un reptil y tiene escamas.'],
['Encuentra','¿Qué elemento de la escena ilumina la charca?',['🌿 Planta','☀️ Sol','🐸 Rana'],1,'Mira hacia el cielo.','La luz del sol llega al agua y a la orilla.'],
['Clasifica','¿Qué tipo de factor es la rana?',['Biótico','Abiótico'],0,'¿Es un ser vivo?','La rana es un animal. Forma parte de los factores bióticos.'],
['Clasifica','¿Cómo clasificarías la temperatura del agua?',['Biótico','Abiótico'],1,'Piensa si la temperatura puede crecer y reproducirse.','La temperatura es una condición física del medio.'],
['Clasifica','¿Cómo clasificarías las algas de la charca?',['Biótico','Abiótico'],0,'Las algas crecen en el agua.','Las algas son seres vivos.'],
['Predice','La charca se seca. ¿Qué ocurre con los renacuajos?',['Tienen más refugios','Pierden el agua que necesitan','Se convierten en lagartos'],1,'Los renacuajos viven en el agua.','Al secarse la charca, los renacuajos pierden su hábitat.'],
['Predice','Hay menos insectos. ¿Qué cambia para los lagartos que los comen?',['Encuentran menos alimento','Reciben menos luz','Tienen más agua'],0,'Piensa en lo que come el lagarto.','Si disminuye una presa, sus depredadores pueden tener más dificultad para alimentarse.'],
['Predice','Una zona de la charca queda siempre a oscuras. ¿Qué les costará hacer a sus algas?',['Mojarse','Moverse con el agua','Fabricar su alimento'],2,'Para la fotosíntesis hace falta luz.','Las algas necesitan luz para fabricar su alimento mediante la fotosíntesis.']
];
let index,score,guided,missed;
function button(parent,label,action){const b=document.createElement('button');b.textContent=label;b.onclick=action;get(parent).append(b);return b}
function clear(){for(const id of ['step','hint','buttons','note','next'])get(id).replaceChildren()}
function home(){clear();get('question').textContent='Explora una charca canaria';get('hint').textContent='Encuentra seres vivos, clasifica pistas y descubre qué pasa cuando cambia la charca.';for(const [label,mode] of [['Jugar',false],['Jugar con pistas',true]])button('buttons',label,()=>{guided=mode;index=score=0;round()})}
function round(){clear();missed=false;const [phase,q,options,answer,hint,why]=challenges[index];get('step').textContent=phase+' · '+(index+1)+' de '+challenges.length;get('question').textContent=q;get('question').focus();if(guided)get('hint').textContent=hint;
const choices=options.map((_,i)=>i);if(guided&&choices.length>2)choices.splice(choices.filter(i=>i!==answer).pop(),1);
for(const i of choices){const b=button('buttons',options[i],()=>{if(i!==answer){missed=true;b.disabled=true;get('note').textContent='Prueba otra vez. '+hint;return}if(!missed)score++;for(const item of get('buttons').children)item.disabled=true;get('note').textContent='¡Correcto! '+why;button('next',index===challenges.length-1?'Ver resultado':'Continuar',()=>{index++;if(index===challenges.length)finish();else round()}).focus()})}}
function finish(){clear();get('question').textContent='¡Investigación completada!';get('question').focus();get('step').textContent=score+' de '+challenges.length+' aciertos al primer intento';get('hint').textContent='Para Classroom: elige un ser vivo de la charca y explica cómo depende del agua o de la luz.';button('buttons','Volver al inicio',home)}
home();
</script></html>
